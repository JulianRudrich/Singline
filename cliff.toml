# Release notes and CHANGELOG.md, generated from the Conventional Commits by git-cliff.

[changelog]
header = """
# Changelog

All notable changes to Singline. The project follows [Semantic Versioning](https://semver.org), and this file is generated from the commit messages.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^style", group = "<!-- 3 -->Design" },
  { message = "^refactor", group = "<!-- 4 -->Under the hood" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  # Dependabot's updates, apart from the rest.
  { message = "^(build|ci|chore)\\(deps(-dev)?\\)", group = "<!-- 8 -->Dependencies" },
  { message = "^(chore|ci|build)", group = "<!-- 7 -->Maintenance" },
]
