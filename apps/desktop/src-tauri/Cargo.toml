[package]
name = "singline"
description = "Synced lyrics above your other windows, for Spotify, Apple Music and Amazon Music."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "singline"

[features]
default = ["sing-to-find"]
# Whisper and the microphone for Sing to find. Building them needs cmake, a C++
# compiler and libclang; without this feature Singline builds without them.
sing-to-find = ["transcription/whisper", "transcription/microphone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
log = "0.4"
lyrics-core.workspace = true
lyrics-providers.workspace = true
media-session.workspace = true
open = "5"
serde.workspace = true
serde_json.workspace = true
spotify-connect.workspace = true
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
transcription.workspace = true

# The terminal view, `singline lyrics`, in the terminal's own colours. A
# Windows app has no terminal to draw in. signal-hook quits cleanly at logout,
# at shutdown and on Ctrl+C.
[target.'cfg(unix)'.dependencies]
crossterm = "0.29"
signal-hook = "0.3"
terminal-colorsaurus = "1.0"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[lints]
workspace = true
