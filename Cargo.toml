[workspace]
resolver = "2"
members = ["crates/lyrics-core", "crates/media-session", "crates/lyrics-providers", "crates/spotify-connect", "crates/transcription", "apps/desktop/src-tauri"]
# The app embeds the built frontend, so plain `cargo test` covers the crates only.
default-members = ["crates/lyrics-core", "crates/media-session", "crates/lyrics-providers", "crates/spotify-connect", "crates/transcription"]

[workspace.package]
version = "0.3.0-alpha.0"
edition = "2021"
# rusqlite, for the lyrics store, needs 1.89.
rust-version = "1.89"
license = "GPL-3.0-or-later"
authors = ["Julian Rudrich"]
repository = "https://github.com/JulianRudrich/Singline"
publish = false

[workspace.dependencies]
lyrics-core = { path = "crates/lyrics-core" }
media-session = { path = "crates/media-session" }
lyrics-providers = { path = "crates/lyrics-providers" }
spotify-connect = { path = "crates/spotify-connect" }
# The app chooses the features, so a build without Whisper stays possible.
transcription = { path = "crates/transcription", default-features = false }

regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
