name: Lint

# Quick checks next to CI, a minute or two each: the workflows, the spelling,
# the links and the Rust dependencies. They also run on main once a week, for
# links that broke elsewhere and for new security advisories.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Syntax, expressions and the shell scripts, with the runner's shellcheck.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: zizmor
        # Security problems; the settings are in .github/zizmor.yml.
        run: pipx run zizmor==1.32.0 --offline --format=github .github

  spelling:
    name: Spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: typos
        # The words it should accept are in typos.toml.
        run: pipx run typos==1.52.2

  links:
    name: Links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the website together
        run: bash scripts/build-site.sh
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # A change checks the links between the repository's files; the
          # weekly run checks every link. The settings are in lychee.toml.
          args: >-
            --no-progress
            ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--offline' || '' }}
            './**/*.md' '_site/**/*.html'

  dependencies:
    name: Rust dependencies (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory can appear without any change here, so advisories show as
    # a failed job without failing the run. The settings are in deny.toml.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}
