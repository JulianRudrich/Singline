name: Website

# Publishes site/ to GitHub Pages, with the pictures from docs/images, once
# Pages is switched on in the repository settings (source: GitHub Actions).
# Runs for every release, but not for the test build release: the Release
# workflow starts it after publishing, because a release published with the
# workflow's own token starts no other workflow. A release published by hand
# starts it through the release event. Run it by hand for changes in between.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits rather than break off one that
# is under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Put the site together
        run: bash scripts/build-site.sh _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
