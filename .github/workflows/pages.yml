name: Website

# Publishes site/ to GitHub Pages, with the pictures from docs/images.
# Runs by hand and for every release, but not for the test build release,
# until Pages is switched on in the repository settings.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Put the site together
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/demo.gif docs/images/karaoke.gif docs/images/settings.png docs/images/social-preview.png _site/images/
          cp apps/desktop/design/app-icon.svg _site/images/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
