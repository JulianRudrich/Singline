name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build the Windows and macOS apps for testing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Every commit on main gets complete test builds; other branches only need their latest run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux checks and end-to-end test
    runs-on: ubuntu-24.04
    # About 8 minutes with a warm cache, 30 when whisper.cpp is built afresh.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          # libasound2-dev for the microphone, cmake and libclang-dev to build whisper.cpp,
          # espeak-ng to synthesize the singing for the Sing to find check.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libasound2-dev libclang-dev cmake \
            xvfb dbus dbus-x11 imagemagick x11-xserver-utils x11-utils espeak-ng
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # whisper.cpp is built again only for a new version of it, never for
          # new settings, so other settings in .cargo/config.toml need a cache
          # of their own.
          key: whisper-${{ hashFiles('.cargo/config.toml') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the interface
        run: |
          pnpm --filter singline-desktop check
          pnpm --filter singline-desktop test
          pnpm --filter singline-desktop build
      - name: Test the browser extension
        run: node --test "extensions/browser/test/*.test.js"
      - name: Test the Pi extension
        run: node --test "extensions/pi/test/*.test.ts"
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build the app
        run: |
          pnpm --filter singline-desktop tauri build --debug --no-bundle
          cargo build -p media-session --example fake_mpris_player
      - name: End-to-end test
        run: bash apps/desktop/e2e/linux-smoke.sh
      - name: End-to-end test for YouTube
        run: bash apps/desktop/e2e/linux-youtube.sh
      - name: Cache the Whisper model for Sing to find
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/singline-e2e
          key: whisper-ggml-tiny-be07e048
      - name: Download the Whisper model for Sing to find
        run: |
          model=~/.cache/singline-e2e/ggml-tiny.bin
          if ! echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  $model" | sha256sum --check --status 2>/dev/null; then
            mkdir -p ~/.cache/singline-e2e
            curl --fail --location --retry 3 --output "$model" \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
            echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  $model" | sha256sum --check
          fi
      - name: End-to-end test for Sing to find
        run: bash apps/desktop/e2e/linux-sing.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-end-to-end
          path: |
            target/e2e
            target/e2e-youtube
            target/e2e-sing
          if-no-files-found: ignore

  desktop:
    name: ${{ matrix.name }} build
    needs: linux
    # Test builds for every push to main, on request, and for version tags.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.desktop) || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: ""
            tauri-args: ""
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the packages run on as many distributions as possible.
          - name: Linux
            os: ubuntu-22.04
            targets: ""
            tauri-args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    # Up to 16 minutes so far, for the macOS app for both processors.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # whisper.cpp is built again only for a new version of it, never for
          # new settings, so other settings in .cargo/config.toml need a cache
          # of their own.
          key: whisper-${{ hashFiles('.cargo/config.toml') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Number the test build
        # Builds of main count up from the next minor version, such as 0.4.0-70,
        # so installed test builds take each newer one as an update.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          current=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          IFS=. read -r major minor _ <<< "${current%%-*}"
          version="$major.$((minor + 1)).0-${{ github.run_number }}"
          node scripts/set-version.mjs "$version"
          echo "TEST_VERSION=$version" >> "$GITHUB_ENV"
      - name: Point bindgen at LLVM for whisper.cpp
        # The Windows runners come with LLVM; elsewhere libclang is found by itself.
        if: runner.os == 'Windows'
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Configure whisper.cpp afresh
        # The cache can come from a runner with another Visual Studio, whose
        # compiler paths CMake would keep.
        if: runner.os == 'Windows'
        run: rm -rf target/*/build/whisper-rs-sys* target/*/*/build/whisper-rs-sys*
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 \
            libasound2-dev libclang-dev cmake
      - name: Tests on this system
        # The Linux job above already runs every test.
        if: runner.os != 'Linux'
        run: cargo test -p lyrics-core -p media-session -p lyrics-providers -p transcription
      - name: Build singline-watch
        run: |
          mkdir -p dist-test
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release -p media-session --bin singline-watch --target aarch64-apple-darwin
            cargo build --release -p media-session --bin singline-watch --target x86_64-apple-darwin
            lipo -create -output dist-test/singline-watch \
              target/aarch64-apple-darwin/release/singline-watch target/x86_64-apple-darwin/release/singline-watch
            tar -czf dist-test/singline-watch-macos.tar.gz -C dist-test singline-watch
            rm dist-test/singline-watch
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --release -p media-session --bin singline-watch
            cp target/release/singline-watch.exe dist-test/
          else
            cargo build --release -p media-session --bin singline-watch
            tar -czf dist-test/singline-watch-linux.tar.gz -C target/release singline-watch
          fi
      - name: Build the app
        # The secrets go to this step only, not to the actions the job uses.
        env:
          # A Genius token for Sing to find, built in so test builds work without setup.
          SINGLINE_GENIUS_TOKEN: ${{ secrets.SINGLINE_GENIUS_TOKEN }}
          # Signs the update packages; without it the builds cannot update themselves.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Update packages need the signing key; without it there are installers only.
          config=()
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            config=(--config "$RUNNER_TEMP/no-updater.json")
          fi
          pnpm --filter singline-desktop tauri build ${{ matrix.tauri-args }} "${config[@]}"
      - name: Collect the installers
        run: |
          find target -path '*/release/bundle/*' \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist-test/ \;
          ls -la dist-test
          if [ -n "${TEST_VERSION:-}" ]; then
            # For the test build release: the same names every time, so its links stay.
            mkdir -p nightly
            case "${{ runner.os }}" in
              macOS)
                cp target/universal-apple-darwin/release/bundle/dmg/*.dmg nightly/Singline-macOS.dmg
                for file in target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*; do
                  [ -e "$file" ] && cp "$file" "nightly/Singline-macOS.app.tar.gz${file##*.tar.gz}"
                done
                ;;
              Windows)
                for file in target/release/bundle/nsis/*-setup.exe*; do
                  cp "$file" "nightly/Singline-Windows-setup.exe${file##*-setup.exe}"
                done
                ;;
              Linux)
                cp target/release/bundle/deb/*.deb nightly/Singline-Linux.deb
                for file in target/release/bundle/appimage/*.AppImage*; do
                  cp "$file" "nightly/Singline-Linux.AppImage${file##*.AppImage}"
                done
                ;;
            esac
            ls -la nightly
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singline-${{ matrix.name }}
          path: dist-test
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.TEST_VERSION != ''
        with:
          name: nightly-${{ matrix.name }}
          path: nightly
          if-no-files-found: error

  nightly:
    name: Publish the test build
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: nightly
          merge-multiple: true
      - name: Write the update manifest
        run: |
          current=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          IFS=. read -r major minor _ <<< "${current%%-*}"
          version="$major.$((minor + 1)).0-${{ github.run_number }}"
          echo "TEST_VERSION=$version" >> "$GITHUB_ENV"
          if ls nightly/*.sig > /dev/null 2>&1; then
            node scripts/update-manifest.mjs nightly "$version" \
              "https://github.com/${{ github.repository }}/releases/download/nightly" \
              "Test build $version of ${GITHUB_SHA::7}" > nightly/latest.json
          else
            echo "::warning::Without the TAURI_SIGNING_PRIVATE_KEY secret this test build cannot update itself."
          fi
          ls -la nightly
      - name: Replace the test build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          The newest test build of \`main\` (${GITHUB_SHA::7}). Installed test builds update themselves to it.

          To install it the first time, download the file for your system:

          - **macOS:** \`Singline-macOS.dmg\`
          - **Windows:** \`Singline-Windows-setup.exe\`
          - **Linux:** \`Singline-Linux.AppImage\` or \`Singline-Linux.deb\`

          Test builds are not signed by Apple or Microsoft yet: see Install in the README for opening them anyway.
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly nightly/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Test build $TEST_VERSION" --notes-file notes.md
