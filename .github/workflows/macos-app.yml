name: macOS app (Swift)

# Only for changes to the native macOS app, which shares no code with the rest.
on:
  push:
    paths:
      - apps/macos/**
      - .github/workflows/macos-app.yml
  pull_request:
    paths:
      - apps/macos/**
      - .github/workflows/macos-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      - name: Run core checks
        run: swift run LyricsCoreChecks
      - name: Build universal preview archive
        run: bash build-release.sh
      - name: Verify packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "dist/Lyrics-Overlay-$VERSION-universal.zip" "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Lyrics Overlay.app"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "de.local.lyricsoverlay"
          codesign --verify --verbose=2 "$APP"
          for ARCH in arm64 x86_64; do lipo "$APP/Contents/MacOS/LyricsOverlay" -verify_arch "$ARCH"; done
      - name: Upload preview archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lyrics-Overlay-${{ env.VERSION }}-universal
          path: apps/macos/dist/Lyrics-Overlay-${{ env.VERSION }}-universal.zip
          if-no-files-found: error
